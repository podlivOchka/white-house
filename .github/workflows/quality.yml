name: Storefront checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          if test -f package-lock.json; then
            npm ci
          else
            npm install
          fi
      - name: Validate calculations
        run: npm test
      - name: Build production storefront
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile journeys
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: white-house-website
          path: dist/
          retention-days: 90
      - name: Preserve verified images and dependency lockfile
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/images/
          if ! git diff --cached --quiet; then
            git commit -m "Store verified catalog images and dependency lockfile"
            git push origin "HEAD:${SOURCE_BRANCH}"
          fi
