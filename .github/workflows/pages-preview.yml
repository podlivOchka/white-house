name: Pages preview
on:
  workflow_dispatch:
  push:
    branches: [site/initial-catalog]
permissions:
  contents: read
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /white-house-kaspiysk/
      VITE_PREVIEW: "true"
      VITE_SITE_URL: https://podlivochka.github.io/white-house-kaspiysk/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-browser-report
          path: |
            playwright-report-pages/
            test-results/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
